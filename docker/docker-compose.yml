#docker-compose -f docker/docker-compose.yml down -v && docker-compose -f docker/docker-compose.yml up --build --force-recreate --no-deps
services:
  jena:
    build:
      context: ..
      dockerfile: docker/Dockerfile
#    image: itimizer/jena:1.0.0
    container_name: jena-container
    ports:
      - "8080:8080"
    env_file:
      - app.env
    volumes:
      - ./cacert.crt:/app/cacert.crt
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    env_file:
      - db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 5s
      retries: 10
volumes:
  pgdata: