        - addPrimaryKey:
            tableName: rule_filters
            columnNames: rule_id, filter_id
            constraintName: pk_rule_filters
        - addForeignKeyConstraint:
            baseTableName: rule_filters
            baseColumnNames: rule_id
            referencedTableName: rules
