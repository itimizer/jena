databaseChangeLog:
  - changeSet:
      id: 20260701-1
      author: kyakovlev
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: password
                  type: VARCHAR(68)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
  - changeSet:
      id: 20260701-2
      author: kyakovlev
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: authorities
      changes:
        - createTable:
            tableName: authorities
            columns:
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_authorities_users
                    references: users(username)
              - column:
                  name: authority
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
  - changeSet:
      id: 20260701-3
      author: kyakovlev
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: jira_filters
      changes:
        - createSequence:
            sequenceName: jira_filter_sequence
            startValue: 1
            incrementBy: 1
            dataType: bigint
        - createTable:
            tableName: jira_filters
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_jira_filters_name
              - column:
                  name: jql
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: mode
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: template_id
                  type: BIGINT
              - column:
                  name: schedule_cron
                  type: VARCHAR(255)
              - column:
                  name: schedule_zone
                  type: VARCHAR(64)
              - column:
                  name: created_by
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_by
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE jira_filters ADD CONSTRAINT ck_jira_filters_template_by_mode
              CHECK ( (mode = 'INCREMENTAL' AND template_id IS NULL AND schedule_cron IS NULL)
                   OR (mode = 'SNAPSHOT'    AND template_id IS NOT NULL) )
